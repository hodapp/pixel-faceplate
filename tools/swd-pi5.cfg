# read-only SWD probe of the faceplate MCU (U11) from faceplate-pi's GPIO.
#
# Run on faceplate-pi: sudo openocd -f swd-pi5.cfg
# It only asks the debug port who it is. No target is created, so OpenOCD never
# halts, resets or touches flash. Don't add a target, flash or reset lines here.

adapter driver linuxgpiod

# The stock raspberrypi5-gpiod.cfg puts SWCLK/SWDIO on GPIO 11/8, which are the
# SOIC clip's SPI clock and CS on this bench, so these use free pins instead:
# GPIO 22 = header pin 15, GPIO 27 = header pin 13. Chip 0 is RP1's GPIO bank on
# Pi OS Trixie (gpioinfo -c 0 lists GPIO0-27).
adapter gpio swclk 22 -chip 0
adapter gpio swdio 27 -chip 0

transport select swd
# linuxgpiod bitbangs as fast as it can and ignores adapter speed. Set
# /sys/module/pcie_aspm/parameters/policy to performance first or the first
# pulses come out far too fast (the stock config's warning).

# No reset wiring at all, so OpenOCD can't pulse a reset line.
reset_config none

swd newdap u11 cpu -enable
dap create u11.dap -chain-position u11.cpu

init
dap info
shutdown
